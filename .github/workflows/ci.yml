name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22']
        include:
          - os: ubuntu-latest
            node: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  manifests:
    name: Plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate
        run: |
          claude plugin validate .
          claude plugin validate plugins/ng-hop

  install:
    name: Install on a clean machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Install the plugin the way the README says, from this commit
        run: |
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install ng-hop@ng-hop
      # A file the plugin forgot to ship only shows up when the installed copy runs.
      - name: Run a real plan from the installed copy
        run: |
          plan="$(find "$HOME/.claude/plugins/cache" -name plan.mjs -path '*ng-hop*' | head -1)"
          test -n "$plan"
          app="$(mktemp -d)"
          echo '{"name":"app","dependencies":{"@angular/core":"20.3.0","@angular/common":"20.3.0"},"devDependencies":{"@angular/cli":"20.3.0"}}' > "$app/package.json"
          node "$plan" --project "$app" --to 21 | tee "$app/plan.txt"
          grep -q 'Angular 21 is reachable' "$app/plan.txt"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download gitleaks and check its checksum
        env:
          VERSION: '8.30.1'
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"
          grep "gitleaks_${VERSION}_linux_x64.tar.gz" checksums.txt | sed 's/gitleaks_.*$/gitleaks.tar.gz/' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the full history
        run: ./gitleaks git --log-opts="--full-history HEAD" --redact --verbose
